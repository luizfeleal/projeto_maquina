# =============================================================================
# docker-compose.yml — SwiftPay / ProjetoMaquina (Laravel 8)
# =============================================================================
#
# VPS / Homologação (comando único):
#   docker compose up -d
#
#   Sobe: app (PHP-FPM em 127.0.0.1:9001) + redis
#   O Nginx do HOST deve usar fastcgi_pass 127.0.0.1:9001
#
# Desenvolvimento local (com Nginx no Docker):
#   docker compose --profile dev up -d
#   docker compose --profile dev --profile assets up node -d
#
# Deploy após git pull na VPS:
#   git pull
#   docker compose up -d --force-recreate
#   docker compose exec app composer install --no-dev --optimize-autoloader
#   docker compose exec app php artisan config:clear
#   docker compose exec app php artisan cache:clear
# =============================================================================

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projetomaquina_app
    restart: unless-stopped
    working_dir: /var/www/html
    # Ignora o entrypoint da imagem (gosu quebra stderr no Linux da VPS).
    # Efeito imediato após git pull — não precisa rebuild da imagem.
    entrypoint: []
    command:
      - sh
      - -ec
      - |
        mkdir -p storage/logs storage/framework/cache storage/framework/sessions storage/framework/views bootstrap/cache
        chown -R www-data:www-data storage bootstrap/cache
        chmod -R 775 storage bootstrap/cache
        exec php-fpm -F
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    ports:
      # Nginx do host (VPS) conecta aqui via FastCGI
      - "127.0.0.1:${PHP_FPM_PORT:-9001}:9000"
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    networks:
      - app_network
    depends_on:
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: projetomaquina_redis
    restart: unless-stopped
    networks:
      - app_network

  nginx:
    profiles:
      - dev
    image: nginx:1.25-alpine
    container_name: projetomaquina_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app_network
    depends_on:
      - app

  node:
    profiles:
      - assets
    image: node:20-alpine
    container_name: projetomaquina_node
    working_dir: /var/www/html
    command: sh -c "npm install && npm run watch-poll"
    volumes:
      - .:/var/www/html
      - node_modules_data:/var/www/html/node_modules
    ports:
      - "${MIX_HMR_PORT:-8080}:8080"
    networks:
      - app_network

volumes:
  vendor_data:
  node_modules_data:

networks:
  app_network:
    driver: bridge
