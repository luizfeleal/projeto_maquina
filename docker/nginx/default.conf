# =============================================================================
# Nginx — Configuração para Laravel 8 (Desenvolvimento)
# Projeto: SwiftPay / ProjetoMaquina
# =============================================================================
#
# Fluxo de uma requisição:
#   1. Navegador → Nginx (porta 80 no host → porta 80 no container)
#   2. Nginx verifica se é arquivo estático (public/): serve diretamente
#   3. Se não encontrado → reescrito para index.php (Front Controller do Laravel)
#   4. index.php → FastCGI → serviço `app` (PHP-FPM na porta 9000)
#
# IMPORTANTE: `fastcgi_pass app:9000` usa o nome do serviço Docker (`app`)
# como hostname. Isso funciona porque ambos estão na mesma rede `app_network`.
# =============================================================================

server {
    listen 80;
    server_name localhost;

    # Raiz do servidor aponta para a pasta public/ do Laravel.
    # Nunca exponha a raiz do projeto — apenas public/ deve ser acessível.
    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    # -------------------------------------------------------------------------
    # Logs: acessíveis via `docker-compose logs nginx`
    # -------------------------------------------------------------------------
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # -------------------------------------------------------------------------
    # Limite de tamanho de upload (deve ser igual ao php.ini: upload_max_filesize)
    # Relevante para upload de certificado EFI nas credenciais.
    # -------------------------------------------------------------------------
    client_max_body_size 64M;

    # -------------------------------------------------------------------------
    # Rota principal: tenta servir arquivo estático → diretório → index.php
    # Esta é a regra central do Front Controller pattern do Laravel.
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # -------------------------------------------------------------------------
    # Arquivos ignorados: não loga acesso a favicon e robots.txt
    # -------------------------------------------------------------------------
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # -------------------------------------------------------------------------
    # Página de erro 404: delega ao Laravel (que retorna sua própria página 404)
    # -------------------------------------------------------------------------
    error_page 404 /index.php;

    # -------------------------------------------------------------------------
    # Processamento PHP via FastCGI
    # Qualquer arquivo .php é passado ao container PHP-FPM (`app:9000`)
    # -------------------------------------------------------------------------
    location ~ \.php$ {
        # `app` é o hostname do serviço PHP-FPM na rede Docker interna
        fastcgi_pass   app:9000;
        fastcgi_index  index.php;

        # SCRIPT_FILENAME: caminho real do arquivo PHP dentro do container.
        # $realpath_root resolve links simbólicos (importante para o Laravel).
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;

        # Aumenta o timeout para requisições lentas (ex: geração de relatório XLSX,
        # chamadas à API externa com latência alta)
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;

        # Buffer para respostas grandes do PHP (ex: download de planilha)
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # -------------------------------------------------------------------------
    # Segurança: bloqueia acesso a arquivos ocultos (.env, .git, .htaccess, etc.)
    # Exceção: .well-known (necessário para Let's Encrypt em produção)
    # -------------------------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # -------------------------------------------------------------------------
    # Cache de assets estáticos (CSS, JS, imagens)
    # Em desenvolvimento, comentar ou reduzir o tempo de cache.
    # -------------------------------------------------------------------------
    # location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
    #     expires 1d;
    #     add_header Cache-Control "public, no-transform";
    # }
}
