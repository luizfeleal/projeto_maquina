<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1E2E5E">
    <title>Sem conexão — SwiftPay</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
            background: #f4f6fb;
            color: #374151;
            padding: 24px;
        }
        .card {
            max-width: 420px;
            width: 100%;
            background: #fff;
            border: 1px solid #e8ecf0;
            border-radius: 16px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 1px 6px rgba(0,0,0,.06);
        }
        h1 { margin: 0 0 8px; font-size: 1.25rem; color: #111827; }
        p { margin: 0 0 20px; font-size: .9rem; color: #6b7280; line-height: 1.5; }
        button {
            background: #2C9BA5;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            font-size: .875rem;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Você está offline</h1>
        <p>Não foi possível carregar esta página. Verifique sua conexão com a internet e tente novamente.</p>
        <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </div>
</body>
</html>
